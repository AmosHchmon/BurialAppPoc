name: Build and deploy Node.js app to Azure Web App - burial-app

on:
  push:
    branches:
      - task-1514-init-burial-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: WebApp
        run: |
          npm install
          npm run build

      # שלב בדיקה: מדפיס ללוג את הקבצים שנוצרו כדי לוודא שהנתיב נכון
      - name: List files in dist
        run: ls -R WebApp/dist/emergency-burial-app/browser

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # אנחנו מעלים את התוכן של תיקיית ה-browser
          path: WebApp/dist/emergency-burial-app/browser/.

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./publish # הורדה לתיקייה מוגדרת מראש

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B018D377A7EC4F2E8E802FE047207C85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_79B40B89188F4F5E857FCA561CA50938 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9A672855C4944CC5AB643DD87F6F6538 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'burial-app'
          slot-name: 'Production'
          package: ./publish # פריסה מתוך התיקייה שאליה הורדנו



