# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - burial-app

on:
  push:
    branches:
      - task-1514-init-burial-app
    paths:
      - 'WebApp/**' # מפעיל את ה-Workflow רק כשמשנים קוד בתוך תיקיית ה-Frontend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4 # עדכון לגרסה יציבה
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        # השורה למטה היא הקריטית ביותר - היא פותרת את שגיאת ה-ENOENT
        working-directory: WebApp 
        run: |
          npm install
          npm run build --if-present
          # אם יש לך טסטים באנגולר, וודא שהם מוגדרים לרוץ ב-CI (בלי דפדפן פתוח)
          # npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # שים לב: הנתיב הזה חייב להתאים בדיוק למה שמוגדר ב-angular.json תחת outputPath
          path: WebApp/dist/emergency-burial-app 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B018D377A7EC4F2E8E802FE047207C85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_79B40B89188F4F5E857FCA561CA50938 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9A672855C4944CC5AB643DD87F6F6538 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'burial-app'
          slot-name: 'Production'
          package: . # אנחנו משתמשים בנקודה כי ה-Artifact כבר מכיל רק את הקבצים המוכנים מה-dist
