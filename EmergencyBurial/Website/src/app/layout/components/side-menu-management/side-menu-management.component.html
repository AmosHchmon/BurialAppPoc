<div class="p-3">
  <div class="mb-5 fs-4 fw-bold text-primary">מערכת ניהול</div>
  @for (item of menuItems; track item.url) {
    <div class="p-3 mb-2 rounded cursor-pointer d-flex align-items-center gap-3 menu-item"
         (click)="navigate(item.url)"
         pRipple>
      <i [class]="item.icon + ' fs-5'"></i>
      <span>{{ item.name }}</span>
    </div>
  }
</div>
