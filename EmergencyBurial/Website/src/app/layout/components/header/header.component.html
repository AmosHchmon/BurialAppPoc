<header class="d-flex justify-content-between align-items-center pt-3 px-5 border border-bottom-1">
  <div class="d-flex gap-5 mx-5 mt">
    <div class="h-50">
      <img class="img-fluid"
           [ngSrc]="constants.israelLogo"
           width="50"
           height="40"
           priority="true"
           alt="israelLogo">
    </div>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel">
      @for (link of links; track link) {
        <a mat-tab-link
           [routerLink]="link.path"
           routerLinkActive="active-link"
           #rla="routerLinkActive"
           [active]="rla.isActive">
          {{ link.label }}
        </a>
      }
    </nav>
    <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
  </div>
  <div class="d-flex gap-3 w-25 justify-content-evenly">
    <p-floatlabel variant="on">
      <input pInputText id="on_label"
             [(ngModel)]="searchValue"
             (keyup)="applyFilter($event.target.value)"
             pSize="small"
             autocomplete="off" />
      <label for="on_label">On Label</label>
    </p-floatlabel>
    <!--<mdb-form-control>
      <input mdbInput type="text" id="form1"
             (keyup)="applyFilter($event.target.value)"
             [(ngModel)]="searchValue"
             class="form-control"
             placeholder="חיפוש...">
      <label mdbLabel class="form-label" for="form1">ESDFDSFSD</label>
    </mdb-form-control>-->

    <button mat-icon-button>
      <mat-icon>notifications</mat-icon>
    </button>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</header>
