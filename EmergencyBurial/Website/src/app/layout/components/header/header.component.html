<header class="d-flex justify-content-between align-items-center pt-4 px-5 border border-bottom-1">
  <div class="d-flex gap-5 mx-5 mt">
    <div class="h-50">
      <img class="img-fluid"
           [ngSrc]="constants.israelLogo"
           width="50"
           height="40"
           priority="true"
           alt="israelLogo">
    </div>
    <mat-tab-group mat-stretch-tabs="false"
                   mat-align-tabs="start">
      <mat-tab label="דף הבית">דף הבית</mat-tab>
      <mat-tab label="שק חלל">שק חלל</mat-tab>
      <mat-tab label="שינוע">שינוע</mat-tab>
    </mat-tab-group>
  </div>
  <div class="d-flex gap-3 mx-5">
    <mat-form-field appearance="outline">
      <mat-label>חיפוש</mat-label>
      <div class="d-flex align-items-center">
        <input matInput
               type="text"
               (keyup)="applyFilter($event.target.value)"
               [(ngModel)]="searchValue">
        <div matSuffix class="d-flex">
          <button mat-icon-button
                  aria-label="Clear"
                  class="icon-bg"
                  (click)="clearSearchField()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </mat-form-field>
    <button mat-icon-button>
      <mat-icon>notifications</mat-icon>
    </button>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</header>
