<header class="d-flex justify-content-between align-items-center pt-3 px-5 border border-bottom-1">
  <div class="d-flex gap-5">
    <div class="h-50">
      <img class="img-fluid"
           [ngSrc]="constants.israelLogo"
           width="50"
           height="40"
           priority="true"
           alt="israelLogo">
    </div>
    <div class="pb-3">
      <p-tabs>
        <p-tablist>
          @for (tab of tabs; track tab.url) {
            <p-tab [value]="tab.url"
                   [routerLink]="tab.url"
                   routerLinkActive="p-tab-active"
                   class="d-flex align-items-center gap-2">
              <span>{{ tab.name }}</span>
              <i [class]="tab.icon"></i>
            </p-tab>
          }
        </p-tablist>
      </p-tabs>
    </div>
  </div>
  <div class="d-flex gap-4 w-auto justify-content-between align-items-center">

    <span class="pi pi-bell cursor-pointer p-2"
          pTooltip="התראות" tooltipPosition="bottom">
    </span>

    <div class="relative">
      <p-menu #menu [model]="userMenuItems" [popup]="true"></p-menu>

      <div
        class="d-flex align-items-center gap-3 cursor-pointer p-2 border-round"
        (click)="menu.toggle($event)">

        <div class="d-flex flex-column align-items-end">
            <span>
               {{ authCtx.UserRBAC.FullName }}
            </span>
          <span>
                {{ authCtx.UserRBAC.StationDesc }}
          </span>
        </div>

        <p-avatar icon="pi pi-user"
                  shape="circle">
        </p-avatar>

      </div>
    </div>

  </div>
</header>
<app-user-profile
  [(visible)]="showProfileDialog"
  [profileData]="profileData"
  [isEditMode]="isEditMode"
  (onEditModeChange)="isEditMode = $event"
  (onSave)="saveProfile()"
  (onCancel)="cancelEdit()">
</app-user-profile>
