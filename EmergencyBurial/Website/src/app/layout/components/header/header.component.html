<header class="d-flex justify-content-around align-items-center pt-2 border border-bottom-1">
  <div class="d-flex gap-5 mx-5">
    <img class="img-fluid"
         [ngSrc]="constants.israelLogo"
         width="50"
         height="40"
         priority="true"
         alt="israelLogo">
    <mat-tab-group mat-stretch-tabs="false"
                   mat-align-tabs="start">
      <mat-tab label="דף הבית">דף הבית</mat-tab>
      <mat-tab label="שק חלל">שק חלל</mat-tab>
      <mat-tab label="שינוע">שינוע</mat-tab>
    </mat-tab-group>
  </div>
  <div class="d-flex gap-3 mx-5">
    <mat-form-field appearance="outline">
      <mat-label>...חיפוש</mat-label>
      <input matInput
             type="text"
             (keyup)="applyFilter($event.target.value)"
             [(ngModel)]="searchValue">
      <button [@If]="searchValue"
              matSuffix
              mat-icon-button
              aria-label="Clear"
              class="delete-btn d-flex align-items-center justify-content-center"
              (click)="clearSearchField()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <button mat-icon-button>
      <mat-icon color="primary">notifications</mat-icon>
    </button>
    <button mat-icon-button>
      <mat-icon color="primary">account_circle</mat-icon>
    </button>
  </div>
</header>
