<p-tabs [value]="activeTab" (valueChange)="onTabChange($event)">
  <p-tablist class="p-4">
    @for (tab of tabItems; track tab.value) {
      <p-tab [value]="tab.value">{{ tab.header }}</p-tab>
    }
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <div class="p-3">
        <p-accordion [value]="[0]" [multiple]="true">
          @for (panel of deceasedAccordion; track panel.title; let i = $index) {
            <p-accordion-panel [value]="i" pRipple>
              <p-accordion-header class="fw-bold">{{ panel.title }}</p-accordion-header>
              <p-accordion-content>
                <app-deceased-static-fields [data]="panel"></app-deceased-static-fields>
              </p-accordion-content>
            </p-accordion-panel>
          }
        </p-accordion>
      </div>
    </p-tabpanel>
    <p-tabpanel value="1">
      @if (burialDetailsData) {
        <app-deceased-static-fields [data]="burialDetailsData"></app-deceased-static-fields>
      }
    </p-tabpanel>
    <p-tabpanel value="2">
      <app-burial-coordination-form [deceasedId]="this.param"
                                    [isEdit]="isEdit"
                                    (editModeChange)="setEdit($event)">
      </app-burial-coordination-form>
    </p-tabpanel>
    <p-tabpanel value="3">
      <app-burial-process-form [deceasedId]="this.param"
                               [isEdit]="isEdit"
                               (editModeChange)="setEdit($event)">
      </app-burial-process-form>
    </p-tabpanel>
    <p-tabpanel value="4">
      <app-transports-table [transports]="transports"
                            (openDialog)="openTransportDialog($event)">
      </app-transports-table>
      <p-dialog [(visible)]="isTransportDialogOpen"
                closeOnEscape="true"
                dismissableMask="true"
                [style]="{ width: '70rem', maxHeight: '90vh'}"
                header="הוספת שינוע"
                modal="true">
        @if (isTransportDialogOpen) {
          <app-transport-form (saveTransport)="saveTransport($event)"></app-transport-form>
        }
      </p-dialog>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
