@if (isEdit) {
  <div class="d-flex gap-3 w-auto">
    <p-button label="שמור"
              (click)="onSaveBurialProcess()"/>
    <p-button label="בטל"
              (click)="cancelEdit()"/>
  </div>
} @else {
  <p-button label="ערוך"
            class="mt-3"
            (click)="toggleEdit()"/>
}
<div class="d-flex gap-5">
  <div class="d-flex flex-column w-50 gap-5 mt-5">
    <p-floatlabel class="w-100 md:w-56" variant="on">
      <p-select [options]="identificationStatus"
                [(ngModel)]="data.IdentificationStatus"
                [disabled]="!isEdit"
                optionLabel="Text"
                optionValue="Value"
                class="w-100"/>
      <label>סטטוס זיהוי</label>
    </p-floatlabel>
    <p-floatlabel class="w-100 md:w-56" variant="on">
      <p-select [options]="badMessageProcessStatus"
                [(ngModel)]="data.BadMessageProcessStatus"
                [disabled]="!isEdit"
                optionLabel="Text"
                optionValue="Value"
                class="w-100"/>
      <label>סטטוס הודעה מרה</label>
    </p-floatlabel>
    <p-floatlabel class="w-100 md:w-56" variant="on">
      <p-select [options]="collectionStatus"
                [(ngModel)]="data.CollectionStatus"
                [disabled]="!isEdit"
                optionLabel="Text"
                optionValue="Value"
                class="w-100"/>
      <label>סטטוס איסוף</label>
    </p-floatlabel>
    <p-floatlabel class="w-100 md:w-56" variant="on">
      <p-select [options]="burialStatus"
                [(ngModel)]="data.BurialStatus"
                [disabled]="!isEdit"
                optionLabel="Text"
                optionValue="Value"
                class="w-100"/>
      <label>סטטוס קבורה</label>
    </p-floatlabel>
  </div>
  <div class="d-flex flex-column w-50 gap-5 mt-4">
    <div class="d-flex flex-column w-50">
      <label>תאריך תחילת הודעה מרה</label>
      <p-datePicker
        [(ngModel)]="data.BadMessageStartDate"
        [showTime]="true"
        [showIcon]="true"
        dateFormat="dd/mm/yy"
        [hourFormat]="'24'"
        [disabled]="!isEdit"
        class="w-75"
        appConvertTimezone>
      </p-datePicker>
    </div>
    <div class="d-flex align-items-center gap-2">
      <p-checkbox
        inputId="FamilyForumCalled"
        [(ngModel)]="data.IsBadMessageReceived"
        [disabled]="!isEdit"
        [binary]="true"/>
      <label for="FamilyForumCalled">האם התקבלה הודעה מרה</label>
    </div>
  </div>
</div>
