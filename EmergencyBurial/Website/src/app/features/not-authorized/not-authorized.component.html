    <div class="mb-5">

           class="w-full h-auto">
        <circle cx="200" cy="150" r="120" fill="#FEE2E2" fill-opacity="0.5"/>
        <circle cx="200" cy="150" r="90" fill="#FECACA" fill-opacity="0.5"/>

        <rect x="130" y="140" width="140" height="110" rx="10" fill="#EF4444"/>
        <path d="M160 140V110C160 87.9086 177.909 70 200 70C222.091 70 240 87.9086 240 110V140" stroke="#B91C1C"

      נראה שאין לך את ההרשאות המתאימות לצפות בעמוד זה.<br>
    </p>

    <div class="flex justify-content-center gap-3">
      <p-button label="חזור לעמוד הבית"
                icon="pi pi-arrow-right"
                iconPos="right"
                styleClass="p-button-raised p-button-text p-button-plain"

</div>
