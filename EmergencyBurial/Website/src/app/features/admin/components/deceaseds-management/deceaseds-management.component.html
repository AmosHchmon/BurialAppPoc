<div class="p-3 mt-5">
  <p-toolbar class="mb-4 shadow-sm border-0 bg-light">
    <div class="p-toolbar-group-start d-flex gap-3">

      <p-button label="הוסף"
                icon="pi pi-plus"
                severity="success"
                (click)="onAddDeceased()"/>

      <p-button label="עדכן"
                icon="pi pi-pencil"
                severity="info"
                [disabled]="!dt.selection"
                (click)="onEditDeceased()"/>

      <p-button severity="danger"
                label="מחק"
                icon="pi pi-trash"
                outlined
                (click)="onDeleteDeceased()"
                [disabled]="!dt.selection"/>
    </div>
  </p-toolbar>

  <p-table #dt
           [columns]="cols"
           showGridlines="true"
           [value]="deceasedList"
           [tableStyle]="{ 'min-width': '50rem' }"
           [size]="'small'"
           [paginator]="true"
           [rows]="10"
           [showCurrentPageReport]="true"
           currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} רשומות"
           [globalFilterFields]="getGlobalFilterFields()"
           [rowHover]="true"
           selectionMode="single"
           dataKey="Id">

    <ng-template #caption>
      <div class="d-flex flex-column align-items-start justify-content-between p-2 mb-2">
        <h5 class="mb-4">ניהול חללים</h5>
        <p-iconfield class="mb-3">
          <p-inputicon class="pi pi-search"/>
          <input pInputText
                 type="text"
                 (input)="dt.filterGlobal($event.target.value, 'contains')"
                 [(ngModel)]="searchText"
                 placeholder="חפש חלל..."/>
          <p-inputicon class="pi pi-times cursor-pointer" (click)="clearSearch()"/>
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header let-columns>
      <tr>
        <th>בחירה</th>
        @for (col of columns; track col.field) {
          <th [pSortableColumn]="col.field">
            <div class="d-flex align-items-center gap-1 px-2">
              {{ col.header }}
              <p-sortIcon [field]="col.field"/>
            </div>
          </th>
        }
        <th class="px-4"></th>
      </tr>
    </ng-template>

    <ng-template #body let-deceased let-columns="columns">
      <tr [pSelectableRow]="deceased">
        <td style="width: 3rem">
          <p-tableRadioButton [value]="deceased"/>
        </td>
        @for (col of columns; track col.field) {
          <td>
            {{ deceased[col.field] }}
          </td>
        }
        <td>
          <div class="d-flex justify-content-start align-items-center cursor-pointer gap-2"
               (click)="showDeceased(deceased)">
            <span>מידע נוסף</span>
            <span class="pi pi-info-circle"></span>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #empty>
      <tr>
        <td [attr.colspan]="cols.length + 2">אין נתונים זמינים.</td>
      </tr>
    </ng-template>

  </p-table>

  <p-dialog [(visible)]="showDeceasedDialog"
            [header]="newDeceased?.Id ? 'עריכת פרטי חלל' : 'הוספת חלל חדש'"
            [modal]="true"
            [style]="{ width: '45rem' }"
            [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
            [draggable]="false"
            [resizable]="false"
            dismissableMask="true"
            closeOnEscape="true">

    <form #deceasedForm="ngForm" class="p-fluid">
      <div class="row g-4 mt-1">

        <div class="col-md-6 d-flex flex-column gap-4">
          <h6 class="fw-bold border-bottom pb-2">פרטים אישיים</h6>

          <p-floatlabel variant="on">
            <input pInputText
                   id="identityNumber"
                   name="identityNumber"
                   [(ngModel)]="newDeceased.IdentityNumber"
                   #identityNumber="ngModel"
                   required
                   identityvalidator
                   autocomplete="off" />
            <label for="identityNumber">תעודת זהות</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="firstName"
                   name="firstName"
                   [(ngModel)]="newDeceased.FirstName"
                   #firstName="ngModel"
                   required />
            <label for="firstName">שם פרטי</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="lastName"
                   name="lastName"
                   [(ngModel)]="newDeceased.LastName"
                   #lastName="ngModel"
                   required />
            <label for="lastName">שם משפחה</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="fatherName"
                   name="fatherName"
                   [(ngModel)]="newDeceased.FatherName"
                   #fatherName="ngModel"
                   required />
            <label for="fatherName">שם האב</label>
          </p-floatlabel>
        </div>

        <div class="col-md-6 d-flex flex-column gap-4 border-end-md">
          <h6 class="fw-bold border-bottom pb-2">רקע ומגורים</h6>

          <p-floatlabel variant="on">
            <input pInputText
                   id="nationality"
                   name="nationality"
                   [(ngModel)]="newDeceased.Nationality"
                   #nationality="ngModel"
                   required />
            <label for="nationality">לאום</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="homeCity"
                   name="homeCity"
                   [(ngModel)]="newDeceased.HomeCity"
                   #homeCity="ngModel"
                   required />
            <label for="homeCity">עיר מגורים</label>
          </p-floatlabel>

          <div class="field mt-2">
            <label class="mb-3 d-block small fw-bold text-muted">מין</label>
            <div class="d-flex gap-4">
              <div class="d-flex align-items-center gap-2">
                <p-radio-button name="gender"
                                value="זכר"
                                [(ngModel)]="newDeceased.Gender"
                                inputId="gender1"
                                required />
                <label for="gender1" class="m-0">זכר</label>
              </div>
              <div class="d-flex align-items-center gap-2">
                <p-radio-button name="gender"
                                value="נקבה"
                                [(ngModel)]="newDeceased.Gender"
                                inputId="gender2" />
                <label for="gender2" class="m-0">נקבה</label>
              </div>
            </div>
          </div>
        </div>

      </div>
    </form>

    <ng-template pTemplate="footer">
      <div class="d-flex justify-content-start gap-3 w-100 mt-3">
        <p-button [label]="newDeceased?.Id ? 'עדכן חלל' : 'שמור חלל'"
                  [icon]="newDeceased?.Id ? 'pi pi-check' : 'pi pi-plus'"
                  [disabled]="deceasedForm.invalid"
                  (click)="onSaveDeceased()"
                  severity="success" />

        <p-button label="ביטול"
                  icon="pi pi-times"
                  severity="secondary"
                  [outlined]="true"
                  (click)="showDeceasedDialog = false" />
      </div>
    </ng-template>
  </p-dialog>
</div>
