<div class="p-3 mt-5">
  <p-toolbar class="border rounded-4">
    <div class="d-flex gap-4">
      <p-button label="הוסף"
                icon="pi pi-plus"
                (click)="onAddDeceased()"/>
      <p-button label="עדכן"
                icon="pi pi-pencil"
                [disabled]="!dt.selection"
                (click)="onEditDeceased()"/>
      <p-button severity="danger"
                label="מחק"
                icon="pi pi-trash"
                outlined
                (click)="onDeleteDeceased()"
                [disabled]="!dt.selection"
      />
    </div>
  </p-toolbar>

  <p-table #dt
           [columns]="cols"
           showGridlines="true"
           [value]="deceasedList"
           [tableStyle]="{ 'min-width': '50rem' }"
           [size]="'small'"
           [paginator]="true"
           [rows]="10"
           [showCurrentPageReport]="true"
           currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} רשומות"
           [globalFilterFields]="getGlobalFilterFields()"
           [rowHover]="true"
           selectionMode="single"
           dataKey="Id">

    <ng-template #caption>
      <div class="d-flex flex-column align-items-start justify-content-between p-2 mb-2">
        <h5 class="mb-4">ניהול חללים</h5>
        <p-iconfield class="mb-3">
          <p-inputicon class="pi pi-search"/>
          <input pInputText
                 type="text"
                 (input)="dt.filterGlobal($event.target.value, 'contains')"
                 [(ngModel)]="searchText"
                 placeholder="חפש חלל..."/>
          <p-inputicon class="pi pi-times cursor-pointer" (click)="clearSearch()"/>
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header let-columns>
      <tr>
        <th>בחירה</th>
        @for (col of columns; track col.field) {
          <th [pSortableColumn]="col.field">
            <div class="d-flex align-items-center gap-1 px-2">
              {{ col.header }}
              <p-sortIcon [field]="col.field"/>
            </div>
          </th>
        }
        <th class="px-4"></th>
      </tr>
    </ng-template>

    <ng-template #body let-deceased let-columns="columns">
      <tr [pSelectableRow]="deceased">
        <td style="width: 3rem">
          <p-tableRadioButton [value]="deceased"/>
        </td>
        @for (col of columns; track col.field) {
          <td>
            {{ deceased[col.field] }}
          </td>
        }
        <td>
          <div class="d-flex justify-content-start align-items-center cursor-pointer gap-2"
               (click)="showDeceased(deceased)">
            <span>מידע נוסף</span>
            <span class="pi pi-info-circle"></span>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #empty>
      <tr>
        <td [attr.colspan]="cols.length + 2">אין נתונים זמינים.</td>
      </tr>
    </ng-template>

  </p-table>

  <p-dialog [(visible)]="showDeceasedDialog"
            closeOnEscape="true"
            dismissableMask="true"
            [style]="{ width: '50rem', 'max-height': '90vh'}"
            header="הוספת משתמש"
            modal="true">
    <form #deceasedForm="ngForm" class="d-flex flex-column">

      <div class="d-flex">

        <div class="w-50 d-flex flex-column gap-5">
          <p-floatlabel class="mt-4" variant="on">
            <input pInputText
                   #identityNumber="ngModel"
                   class="w-75"
                   required
                   [(ngModel)]="newDeceased.IdentityNumber"
                   [invalid]="identityNumber.invalid && identityNumber.touched"
                   identityvalidator
                   name="identityNumber"
                   autocomplete="off"/>
            <label>תעודת זהות</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   #fullName="ngModel"
                   class="w-75"
                   required
                   [(ngModel)]="newDeceased.FullName"
                   [invalid]="fullName.invalid && fullName.touched"
                   name="firstName"
                   autocomplete="off"/>
            <label>שם מלא</label>
          </p-floatlabel>
        </div>

        <div class="w-50 d-flex flex-column gap-5">

          <p-floatlabel class="mt-4" variant="on">
            <input pInputText
                   #fatherName="ngModel"
                   class="w-75"
                   required
                   [(ngModel)]="newDeceased.FatherName"
                   [invalid]="fatherName.invalid && fatherName.touched"
                   name="fatherName"
                   autocomplete="off"/>
            <label>שם האב</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   #nationality="ngModel"
                   class="w-75"
                   required
                   [(ngModel)]="newDeceased.Nationality"
                   [invalid]="nationality.invalid && nationality.touched"
                   name="nationality"
                   autocomplete="off"/>
            <label>לאום</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   #homeCity="ngModel"
                   class="w-75"
                   required
                   [(ngModel)]="newDeceased.HomeCity"
                   [invalid]="homeCity.invalid && homeCity.touched"
                   name="homeCity"
                   autocomplete="off"/>
            <label>עיר מגורים</label>
          </p-floatlabel>

          <div class="d-flex gap-3">
            <strong>מין:</strong>
            <div class="d-flex flex-wrap gap-2">
              <p-radio-button name="gender"
                              required
                              value="זכר"
                              [(ngModel)]="newDeceased.Gender"
                              inputId="gender1"/>
              <label for="gender1" class="ml-2">זכר</label>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <p-radio-button name="gender"
                              value="נקבה"
                              [(ngModel)]="newDeceased.Gender"
                              inputId="gender2"/>
              <label for="gender2" class="ml-2">נקבה</label>

            </div>
          </div>

        </div>
      </div>

      <div class="mt-5">

        @if (!newDeceased?.Id) {
          <p-button label="שמור"
                    class="mt-3"
                    [disabled]="deceasedForm.invalid"
                    (click)="onSaveDeceased()"/>
        } @else {
          <p-button label="עדכן"
                    class="mt-3"
                    [disabled]="deceasedForm.invalid"
                    (click)="onSaveDeceased()"/>
        }
      </div>

    </form>
  </p-dialog>
</div>
