<div class="p-3 mt-5">
  <p-toolbar class="mb-4 shadow-sm border-0 bg-light">
    <div class="p-toolbar-group-start d-flex gap-3">
      <p-button label="הוספת אירוע" icon="pi pi-plus" severity="success" (click)="onAddEvent()"/>
      <p-button label="עריכה" icon="pi pi-pencil" severity="info" [disabled]="!dt.selection" (click)="onEditEvent()"/>
    </div>
  </p-toolbar>

  <p-table #dt
           [value]="events"
           [rows]="10"
           [size]="'small'"
           showGridlines="true"
           [tableStyle]="{ 'min-width': '50rem' }"
           [paginator]="true"
           [rowHover]="true"
           dataKey="Id"
           selectionMode="single"
           currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} אירועים"
           [showCurrentPageReport]="true">

    <ng-template #caption>
      <div class="d-flex flex-column align-items-start justify-content-between p-2 mb-2">
        <h5 class="mb-4">ניהול אירועים</h5>
        <p-iconfield class="mb-3">
          <p-inputicon class="pi pi-search"/>
          <input pInputText
                 type="text"
                 (input)="dt.filterGlobal($event.target.value, 'contains')"
                 [(ngModel)]="searchText"
                 placeholder="חפש אירוע..."/>
          <p-inputicon class="pi pi-times cursor-pointer" (click)="clearSearch()"/>
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>בחירה</th>
        @for (col of eventsColumns; track col.field) {
          <th>{{ col.header }}</th>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-event>
      <tr [pSelectableRow]="event">
        <td>
          <p-tableRadioButton [value]="event"/>
        </td>
        <td>{{ event.Name }}</td>
        <td>
          @if (event.IsExercise) {
            <div class="d-flex align-items-center gap-2 text-primary">
              <i class="pi pi-map"></i>
              <span>תרגיל</span>
            </div>
          } @else {
            <div class="d-flex align-items-center gap-2 text-danger fw-bold">
              <i class="pi pi-exclamation-triangle"></i>
              <span>אירוע אמת</span>
            </div>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog [(visible)]="showEventDialog"
            [header]="newEvent?.Id ? 'עריכת אירוע' : 'הוספת אירוע חדש'"
            [modal]="true"
            [style]="{ width: '30rem' }"
            [draggable]="false"
            dismissableMask="true">

    <form #eventForm="ngForm" class="d-flex flex-column py-3">

      <p-floatlabel variant="on">
        <input pInputText
               id="eventName"
               name="eventName"
               [(ngModel)]="newEvent.Name"
               #eventName="ngModel"
               required
               autocomplete="off"/>
        <label for="eventName">שם האירוע</label>
      </p-floatlabel>

      <div class="mt-4 d-flex align-items-center gap-2">
        <p-checkbox name="IsExercise"
                    [(ngModel)]="newEvent.IsExercise"
                    [binary]="true"
                    inputId="isExercise">
        </p-checkbox>
        <label for="isExercise">האם מוגדר כתרגיל?</label>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <div class="d-flex justify-content-start gap-3">
        <p-button label="שמור"
                  icon="pi pi-check"
                  [disabled]="eventForm.invalid"
                  (click)="onSaveEvent()"/>
        <p-button label="ביטול"
                  icon="pi pi-times"
                  severity="secondary"
                  outlined
                  (click)="showEventDialog = false"/>
      </div>
    </ng-template>
  </p-dialog>
</div>
