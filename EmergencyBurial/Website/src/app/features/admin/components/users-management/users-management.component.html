<div class="p-3 mt-5">
  <p-toolbar class="border rounded-4">
    <div class="d-flex gap-4">
      <p-button label="הוסף"
                icon="pi pi-plus"
                severity="success"
                (click)="onAddMember()"/>
      <p-button label="עדכן"
                icon="pi pi-pencil"
                severity="info"
                [disabled]="!dt.selection"
                (click)="onEditMember()"/>
      <p-button severity="danger"
                label="מחק"
                icon="pi pi-trash"
                outlined
                (click)="onDeleteMember()"
                [disabled]="!dt.selection"
      />
    </div>
  </p-toolbar>

  <p-table #dt
           [value]="members"
           [rows]="10"
           [size]="'small'"
           [columns]="membersColumns"
           [paginator]="true"
           [tableStyle]="{ 'min-width': '75rem' }"
           [rowHover]="true"
           dataKey="Id"
           selectionMode="single"
           currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} רשומות"
           [showCurrentPageReport]="true"
  >

    <ng-template #header>
      <tr>
        <th>בחירה</th>
        @for (col of membersColumns; track col.field) {
          <th>{{ col.header }}</th>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="body"
                 let-member>
      <tr [pSelectableRow]="member">
        <td style="width: 3rem">
          <p-tableRadioButton [value]="member"/>
        </td>
        @for (col of membersColumns; track col.field) {
          <td>
            {{ member[col.field] }}
          </td>
        }
      </tr>
    </ng-template>

  </p-table>

  <p-dialog [(visible)]="showMemberDialog"
            [header]="newMember?.Id ? 'עריכת משתמש' : 'הוספת משתמש'"
            [modal]="true"
            [style]="{ width: '45rem' }"
            [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
            [draggable]="false"
            [resizable]="false"
            dismissableMask="true"
            closeOnEscape="true">

    <form #memberForm="ngForm" class="p-fluid">
      <div class="row g-4 mt-1">

        <div class="col-md-6 d-flex flex-column gap-4">
          <h6 class="fw-bold border-bottom pb-2">פרטי זיהוי</h6>

          <p-floatlabel variant="on">
            <input pInputText
                   id="username"
                   name="username"
                   [(ngModel)]="newMember.UserName"
                   #username="ngModel"
                   required
                   identityvalidator
                   autocomplete="off" />
            <label for="username">תעודת זהות</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="fullName"
                   name="fullName"
                   [(ngModel)]="newMember.FullName"
                   #fullName="ngModel"
                   required />
            <label for="fullName">שם מלא</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="mail"
                   name="mail"
                   [(ngModel)]="newMember.Mail"
                   #mail="ngModel"
                   required
                   email />
            <label for="mail">אימייל</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="phoneNumber"
                   name="phoneNumber"
                   [(ngModel)]="newMember.PhoneNumber"
                   #phoneNumber="ngModel"
                   required
                   pattern="^\d{10}$" />
            <label for="phoneNumber">מספר פלאפון</label>
          </p-floatlabel>
        </div>

        <div class="col-md-6 d-flex flex-column gap-4 border-end-md">
          <h6 class="fw-bold border-bottom pb-2">שיוך ארגוני</h6>

          <div>
            <label class="mb-2 d-block small text-muted">ארגון</label>
            <p-select [options]="organizationsList"
                      [(ngModel)]="newMember.OrganizationTypeId"
                      name="OrganizationTypeId"
                      optionLabel="Text"
                      optionValue="Key"
                      placeholder="בחר ארגון"
                      (onChange)="onOrganizationTypeChange()"
                      styleClass="w-100"
                      appendTo="body"
                      required />
          </div>

          <div>
            <label class="mb-2 d-block small text-muted">תחנה</label>
            <p-select [options]="subStationsList"
                      [(ngModel)]="newMember.StationId"
                      name="StationId"
                      optionLabel="Text"
                      optionValue="Key"
                      placeholder="בחר תחנה"
                      [disabled]="!newMember.OrganizationTypeId"
                      styleClass="w-100"
                      appendTo="body"
                      [required]="newMember.OrganizationTypeId != null" />
          </div>

          <div>
            <label class="mb-2 d-block small text-muted">תפקיד</label>
            <p-select [options]="rolesList"
                      [(ngModel)]="newMember.RoleAccessTypeId"
                      name="roleAccessTypeId"
                      optionLabel="Text"
                      optionValue="Value"
                      placeholder="בחר תפקיד"
                      styleClass="w-100"
                      appendTo="body"
                      required />
          </div>
        </div>

      </div>
    </form>

    <ng-template pTemplate="footer">
      <div class="d-flex justify-content-start gap-2 w-100">
        <p-button [label]="newMember?.Id ? 'עדכן שינויים' : 'שמור משתמש'"
                  [icon]="newMember?.Id ? 'pi pi-check' : 'pi pi-plus'"
                  [disabled]="memberForm.invalid"
                  (click)="onSaveMember()"
                  severity="primary" />

        <p-button label="ביטול"
                  icon="pi pi-times"
                  severity="secondary"
                  [outlined]="true"
                  (click)="showMemberDialog = false" />
      </div>
    </ng-template>
  </p-dialog>
</div>
