<div class="p-3 mt-5">
  <p-toolbar class="mb-4 shadow-sm border-0 bg-light">
    <div class="p-toolbar-group-start d-flex gap-3">

      <p-button label="הוספת משתמש"
                icon="pi pi-plus"
                severity="success"
                (click)="onAddMember()"/>

      <p-button label="עריכה"
                icon="pi pi-pencil"
                severity="info"
                [disabled]="!dt.selection"
                (click)="onEditMember()"/>
      <p-button label="מחיקה"
                icon="pi pi-trash"
                severity="danger"
                outlined
                [disabled]="!dt.selection"
                (click)="onDeleteMember()"/>
    </div>
  </p-toolbar>

  <p-table #dt
           [value]="items"
           [rows]="10"
           [size]="'small'"
           [columns]="membersColumns"
           showGridlines="true"
           [paginator]="true"
           [tableStyle]="{ 'min-width': '75rem' }"
           [rowHover]="true"
           dataKey="Id"
           selectionMode="single"
           currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} רשומות"
           [showCurrentPageReport]="true">

    <ng-template #caption>
      <div class="d-flex flex-column align-items-start justify-content-between p-2 mb-2">
        <h5 class="mb-4">ניהול משתמשים</h5>
        <p-iconfield class="mb-3">
          <p-inputicon class="pi pi-search"/>
          <input pInputText
                 type="text"
                 (input)="dt.filterGlobal($event.target.value, 'contains')"
                 [(ngModel)]="searchText"
                 placeholder="חפש משתמש..."/>
          <p-inputicon class="pi pi-times cursor-pointer" (click)="clearSearch()"/>
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>בחירה</th>
        @for (col of membersColumns; track col.field) {
          <th>{{ col.header }}</th>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="body"
                 let-member>
      <tr [pSelectableRow]="member">
        <td style="width: 3rem">
          <p-tableRadioButton [value]="member"/>
        </td>
        @for (col of membersColumns; track col.field) {
          <td>
            {{ member[col.field] }}
          </td>
        }
      </tr>
    </ng-template>

  </p-table>

  <p-dialog [(visible)]="showDialog"
            [header]="currentItem?.Id ? 'עריכת משתמש' : 'הוספת משתמש'"
            [modal]="true"
            [style]="{ width: '45rem' }"
            [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
            [draggable]="false"
            [resizable]="false"
            dismissableMask="true"
            closeOnEscape="true">

    <form #memberForm="ngForm" class="p-fluid">
      <div class="row g-4 mt-1">

        <div class="col-md-6 d-flex flex-column gap-4">
          <h6 class="fw-bold border-bottom pb-2">פרטי זיהוי</h6>

          <p-floatlabel variant="on">
            <input pInputText
                   id="username"
                   name="username"
                   [(ngModel)]="currentItem.UserName"
                   #username="ngModel"
                   required
                   identityvalidator
                   autocomplete="off"/>
            <label for="username">תעודת זהות</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="fullName"
                   name="fullName"
                   [(ngModel)]="currentItem.FullName"
                   #fullName="ngModel"
                   required/>
            <label for="fullName">שם מלא</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="mail"
                   name="mail"
                   [(ngModel)]="currentItem.Mail"
                   #mail="ngModel"
                   required
                   email/>
            <label for="mail">אימייל</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input pInputText
                   id="phoneNumber"
                   name="phoneNumber"
                   [(ngModel)]="currentItem.PhoneNumber"
                   #phoneNumber="ngModel"
                   required
                   pattern="^\d{10}$"/>
            <label for="phoneNumber">מספר פלאפון</label>
          </p-floatlabel>
        </div>

        <div class="col-md-6 d-flex flex-column gap-4 border-end-md">
          <h6 class="fw-bold border-bottom pb-2">שיוך ארגוני</h6>

          <div>
            <label class="mb-2 d-block small text-muted">ארגון</label>
            <p-select [options]="organizationsList"
                      [(ngModel)]="currentItem.OrganizationTypeId"
                      name="OrganizationTypeId"
                      optionLabel="Text"
                      optionValue="Key"
                      placeholder="בחר ארגון"
                      (onChange)="onOrganizationTypeChange()"
                      class="w-100"
                      appendTo="body"
                      required/>
          </div>

          <div>
            <label class="mb-2 d-block small text-muted">תחנה</label>
            <p-select [options]="subStationsList"
                      [(ngModel)]="currentItem.StationId"
                      name="StationId"
                      optionLabel="Text"
                      optionValue="Key"
                      placeholder="בחר תחנה"
                      [disabled]="!currentItem.OrganizationTypeId"
                      class="w-100"
                      appendTo="body"
                      [required]="isStationRequired()"/>
          </div>

          <div>
            <label class="mb-2 d-block small text-muted">תפקיד</label>
            <p-select [options]="rolesList"
                      [(ngModel)]="currentItem.RoleAccessTypeId"
                      name="roleAccessTypeId"
                      optionLabel="Text"
                      optionValue="Value"
                      placeholder="בחר תפקיד"
                      class="w-100"
                      appendTo="body"
                      required/>
          </div>
        </div>

      </div>
    </form>

    <ng-template pTemplate="footer">
      <div class="d-flex justify-content-start gap-3 w-100">
        <p-button [label]="currentItem?.Id ? 'עדכן משתמש' : 'שמור משתמש'"
                  [icon]="currentItem?.Id ? 'pi pi-check' : 'pi pi-plus'"
                  [disabled]="memberForm.invalid"
                  (click)="onSaveMember()"
                  severity="primary"/>

        <p-button label="ביטול"
                  icon="pi pi-times"
                  severity="secondary"
                  [outlined]="true"
                  (click)="showDialog = false"/>
      </div>
    </ng-template>
  </p-dialog>
</div>
