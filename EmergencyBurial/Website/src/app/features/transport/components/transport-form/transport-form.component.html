<div class="w-100 p-3 mb-3 d-flex flex-column">
  <div class="d-flex">
    <div class="w-50 d-flex flex-column gap-5">
      <p-floatlabel variant="on">
        <input pInputText
               class="w-75"
               [(ngModel)]="newTransport.StartLocation"
               [pAutoFocus]="true"
               autocomplete="off"/>
        <label>מקום התחלת שינוע</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText
               class="w-75"
               [(ngModel)]="newTransport.Purpose"
               autocomplete="off"/>
        <label>תכלית השינוע</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText
               class="w-75"
               [(ngModel)]="newTransport.Organization"
               autocomplete="off"/>
        <label>ארגון משנע</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText
               class="w-75"
               [(ngModel)]="newTransport.Destination"
               autocomplete="off"/>
        <label>מקום יעד שינוע</label>
      </p-floatlabel>
    </div>
    <div class="w-50 d-flex flex-column gap-5">
      <p-floatlabel variant="on">
        <input pInputText
               class="w-75"
               [(ngModel)]="newTransport.VehicleType"
               autocomplete="off"/>
        <label>סוג אמצעי שינוע</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText
               class="w-75"
               [(ngModel)]="newTransport.LicensePlate"
               autocomplete="off"/>
        <label>לוחית זיהוי רכב</label>
      </p-floatlabel>
      <div class="d-flex flex-column w-75">
        <label>שעת התחלת השינוע</label>
        <p-datePicker
          [(ngModel)]="newTransport.StartDateTime"
          [showTime]="true"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
          [hourFormat]="'24'"
          [pAutoFocus]="false"
          appConvertTimezone>
        </p-datePicker>

      </div>
    </div>

  </div>
</div>
<p-button (click)="createTransport()" class="mt-5 p-3">יצירת שינוע</p-button>
