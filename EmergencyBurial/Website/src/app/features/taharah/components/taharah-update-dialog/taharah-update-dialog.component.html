<p-dialog [(visible)]="visible"
          (onHide)="closeDialog()"
          closeOnEscape="true"
          dismissableMask="true"
          header="עדכון פרטי טהרה"
          [modal]="true"
          [style]="{width: '60vw'}"
          [draggable]="false">

  @if (processData) {
    <div class="d-flex my-4 w-50 gap-4">
      <div class="d-flex flex-column gap-4 w-100">
        <div>
          <p-floatlabel variant="on" class="w-100">
            <input pInputText class="w-100" [ngModel]="processData.FullName" [readonly]="true"/>
            <label>שם מלא</label>
          </p-floatlabel>
        </div>
        <div>
          <p-floatlabel variant="on" class="w-100">
            <input pInputText class="w-100" [ngModel]="processData.IdentityNumber" [readonly]="true"/>
            <label>מספר זהות</label>
          </p-floatlabel>
        </div>
      </div>

      <div class="d-flex flex-column gap-4 w-100">
        <div>
          <p-floatlabel variant="on" class="w-100">
            <input pInputText class="w-100" [ngModel]="processData.FatherName" [readonly]="true"/>
            <label>שם האב</label>
          </p-floatlabel>
        </div>
        <div>
          <p-floatlabel variant="on" class="w-100">
            <input pInputText class="w-100" [ngModel]="processData.Gender" [readonly]="true"/>
            <label>מין</label>
          </p-floatlabel>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <label class="font-bold block mb-2">רשימת שקים מקושרים:</label>
      <div class="d-flex gap-2 flex-wrap">
        @for (bag of processData.BagNumbers; track bag) {
          <p-chip [label]="bag" icon="pi pi-inbox"></p-chip>
        } @empty {
          <span class="text-500">אין שקים מקושרים</span>
        }
      </div>
    </div>

    <p-divider></p-divider>

    <div class="d-flex w-100 pt-2 gap-5">
      <div class="d-flex flex-column w-50 gap-4">

        <p-floatlabel variant="on" class="w-100">
          <input pInputText [(ngModel)]="processData.TaharahTeamManager" class="w-100"/>
          <label>שם מבצע הטהרה / מנהל צוות</label>
        </p-floatlabel>

        <p-floatlabel variant="on" class="w-100">
          <input pInputText [(ngModel)]="processData.IntermediateStorage" class="w-100"/>
          <label>פרטי אחסון ביניים (מכולה)</label>
        </p-floatlabel>

        <p-floatlabel variant="on" class="w-100">
          <p-datePicker [(ngModel)]="processData.TaharahExecutionTime"
                        disabled
                        [showTime]="true" hourFormat="24" dateFormat="dd/mm/yy" appendTo="body"
                        class="w-100" appConvertTimezone></p-datePicker>
          <label>תאריך ביצוע הטהרה (מחושב)</label>
        </p-floatlabel>

        <p-floatlabel variant="on" class="w-100">
          <p-datePicker [(ngModel)]="processData.TaharahClosingDate"
                        [showTime]="true" hourFormat="24" dateFormat="dd/mm/yy" appendTo="body"
                        class="w-100" appConvertTimezone></p-datePicker>
          <label>תאריך סגירת הכנה לקבורה</label>
        </p-floatlabel>

      </div>

      <div class="d-flex flex-column w-50 gap-3">

        <div class="d-flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="processData.IsTaharahPerformed"
                      [binary]="true"
                      inputId="isTaharah"
                      (onChange)="onTaharahPerformedChange()"></p-checkbox>
          <label for="isTaharah" class="font-bold cursor-pointer">בוצעה טהרה</label>
        </div>

        <div class="d-flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="processData.HasTachrichim" [binary]="true" inputId="shrouds"></p-checkbox>
          <label for="shrouds" class="font-bold cursor-pointer text-red-500">תכריכי פשתן (חובה לשחרור)</label>
        </div>

        <div class="d-flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="processData.InCoffin" [binary]="true" inputId="isCoffin"></p-checkbox>
          <label for="isCoffin" class="font-bold cursor-pointer">הוכנס לארון</label>
        </div>

        <p-floatlabel variant="on" class="w-100 mt-2">
          <input pInputText
                 [(ngModel)]="processData.CoffinReason"
                 [disabled]="!processData.InCoffin"
                 class="w-100"/>
          <label>סיבת הכנסה לארון</label>
        </p-floatlabel>

        <p-divider></p-divider>

        <div class="d-flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="processData.IsPendingExit"
                      [binary]="true"
                      inputId="pendingExit"
                      (onChange)="onPendingExitChange()"></p-checkbox>
          <label for="pendingExit" class="font-bold cursor-pointer">ממתין ליציאה</label>
        </div>

        <p-floatlabel variant="on" class="w-100 mt-2">
          <input pInputText
                 [disabled]="!processData.IsPendingExit"
                 [(ngModel)]="processData.PendingExitReason"
                 class="w-100"/>
          <label>סיבת המתנה (לדוג': יום שישי)</label>
        </p-floatlabel>
      </div>
    </div>
  }

  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-between w-100 mt-4">

      @if (!isReleasedMode) {
        <p-button label="שחרור"
                  (click)="onRelease()"
                  icon="pi pi-sign-out"
                  severity="warn">
        </p-button>

        <div class="d-flex gap-2">
          <p-button label="ביטול" (click)="closeDialog()" [text]="true" severity="secondary"></p-button>
          <p-button label="שמור שינויים" (click)="submitUpdate()" icon="pi pi-save" severity="primary"></p-button>
        </div>
      }
    </div>
  </ng-template>
</p-dialog>
