<div class="p-3">
  <p-accordion [multiple]="true">

    <p-accordion-panel value="0">

      <p-accordion-header class="fw-bold">סוגי רשימות</p-accordion-header>

      <p-accordion-content>
        <div class="mb-4">
          <p-toolbar class="border rounded-4">
            <div class="d-flex gap-4">
              <p-button label="חדש"
                        icon="pi pi-plus"
                        (click)="onNewListType()"/>
              <p-button label="עדכן"
                        icon="pi pi-pencil"
                        [disabled]="!dt.selection"
                        (click)="onEditListType()"/>
              <p-button severity="danger"
                        label="מחק"
                        icon="pi pi-trash"
                        outlined
                        (click)="deleteSelectedListType()"
                        [disabled]="!dt.selection"
                        />
            </div>
          </p-toolbar>
        </div>

        <p-table #dt
                 [value]="lists"
                 [rows]="10"
                 [size]="'small'"
                 [columns]="listsColumns"
                 [paginator]="true"
                 [tableStyle]="{ 'min-width': '75rem' }"
                 [rowHover]="true"
                 dataKey="Id"
                 selectionMode="single"
                 currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} רשומות"
                 [showCurrentPageReport]="true"
        >

          <ng-template #caption>
            <div class="d-flex align-items-center justify-content-between">
              <h5 class="m-0">ניהול סוגי רשימות</h5>
            </div>
          </ng-template>

          <ng-template #header>
            <tr>
              <th>בחירה</th>
              @for (col of listsColumns; track col.field) {
                <th>{{ col.header }}</th>
              }
            </tr>
          </ng-template>

          <ng-template pTemplate="body"
                       let-listType
                       let-columns="columns">
            <tr [pSelectableRow]="listType">
              <td style="width: 3rem">
                <p-tableRadioButton [value]="listType"/>
              </td>
              <td>
                {{ listType?.Id }}
              </td>
              <td>
                {{ listType?.Text }}
              </td>
              <td>
                <p-checkbox [(ngModel)]="listType.IsValid"
                            [binary]="true"
                            variant="filled"/>
              </td>
            </tr>
          </ng-template>

        </p-table>

        <p-dialog [(visible)]="showDialog"
                  [style]="{ width: '25rem' }"
                  header="הוספת סוג רשימה"
                  modal="true">
          <ng-template #content>
            <div class="d-flex flex-column gap-4">
              <p-floatlabel class="mt-3" variant="on">
                <input pInputText
                       class="w-75"
                       [(ngModel)]="newListType.Text"
                       autocomplete="off"/>
                <label>תיאור</label>
              </p-floatlabel>
              <div class="d-flex align-items-center gap-3">
                <p-checkbox inputId="isValid" [(ngModel)]="newListType.IsValid" [binary]="true"/>
                <label for="isValid" class="mr-3">האם תקף</label>
              </div>

              @if (!newListType?.Id) {
                <p-button label="שמור"
                          class="mt-3"
                          (click)="saveListType()"/>
              } @else {
                <p-button label="עדכן"
                          class="mt-3"
                          (click)="updateListType()"/>
              }

            </div>
          </ng-template>
        </p-dialog>
      </p-accordion-content>
    </p-accordion-panel>
  </p-accordion>
</div>
