<div class="d-flex flex-column mt-4 p-3">
  <h2>לוח מחוונים - המשרד לשירותי דת</h2>
  <div class="d-flex flex-wrap justify-content-center align-items-center gap-5">
    @for (card of dashboardCards; track card.options.plugins.title.text) {
      <app-dashboard-card
        [chartData]="card.data"
        [chartOptions]="card.options"
      ></app-dashboard-card>
    }
  </div>
</div>
