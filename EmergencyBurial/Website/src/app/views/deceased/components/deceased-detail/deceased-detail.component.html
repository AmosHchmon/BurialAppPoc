<p-tabs [(value)]="activeTab">
  <p-tablist class="p-4">
    <p-tab value="0">פרטים</p-tab>
    <p-tab value="1">שינוע להכנה לקבורה</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <div class="p-3">
        <p-accordion [multiple]="true">

          @for (panel of deceasedAccordion; track panel.title; let i = $index) {
            <p-accordion-panel [value]="i" pRipple>
              <p-accordion-header class="fw-bold">{{ panel.title }}</p-accordion-header>
              <p-accordion-content>
                <app-deceased-accordion-content [data]="panel"></app-deceased-accordion-content>
              </p-accordion-content>
            </p-accordion-panel>
          }

          <p-accordion-panel [value]="4" pRipple>
            <p-accordion-header class="fw-bold">טבלת שינועים</p-accordion-header>
            <p-accordion-content>
              <app-transports-table [transports]="deceased?.Transports"
                                    (switchTab)="switchToTransportTab()">
              </app-transports-table>
            </p-accordion-content>
          </p-accordion-panel>

        </p-accordion>
      </div>
    </p-tabpanel>
    <p-tabpanel value="1">
      <app-transport-form [deceasedId]="deceased?.Id"
                          (transportCreated)="handleTransportCreated()">
      </app-transport-form>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
