<div class="d-flex flex-column min-vh-100" dir="rtl">

  <header class="app-header d-flex justify-content-between align-items-center px-3 py-2">
     <button class="btn p-0 text-white">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="station-info">
      <h1 class="fs-6 m-0">תחנת ריכוז חללים (תר"ח)</h1>
      <span class="status-badge online" style="font-size: 0.7rem;">מחובר לסנכרון</span>
    </div>
    <button class="btn p-0 text-white">
      <mat-icon>account_circle</mat-icon>
    </button>
  </header>

  <main class="flex-grow-1 overflow-hidden">
    <router-outlet></router-outlet>
  </main>

  <nav class="d-flex justify-content-around align-items-center bg-white border-top border-2 px-2 py-2">
    <button class="nav-item d-flex flex-column align-items-center border-0 bg-transparent">
      <mat-icon>search</mat-icon>
      <span class="small">חיפוש</span>
    </button>

    <div class="scan-wrapper d-flex flex-column align-items-center position-relative">
      <button class="scan-btn d-flex justify-content-center align-items-center rounded-circle border-0"
              (click)="openScanner()">
        <mat-icon>
      barcode_scanner
    </mat-icon>
      </button>
      <span class="scan-label small fw-bold mt-1">סריקה</span>
    </div>

    <button class="nav-item d-flex flex-column align-items-center border-0 bg-transparent">
      <mat-icon>list</mat-icon>
      <span class="small">רשימה</span>
    </button>
  </nav>

</div>
