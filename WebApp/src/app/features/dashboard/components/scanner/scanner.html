<div class="scanner-wrapper d-flex flex-column align-items-center justify-content-center">
  <div class="scanner-viewport">
    <zxing-scanner [device]="deviceCurrent" (camerasNotFound)="onCamerasNotFound()"
      (scanSuccess)="onCodeResult($event)" [formats]="formatsEnabled" [tryHarder]="tryHarder" (camerasFound)="onCamerasFound($event)">
    </zxing-scanner>

    <div class="scanner-overlay">
      <div class="focus-frame"></div>
      <div class="scan-line"></div>
    </div>
  </div>
</div>

@if (qrResultString) {
<section
  class="results-card shadow-sm mt-3 mx-3 d-flex align-items-center p-3 bg-white rounded-3 border-start border-primary border-5">

  <div class="ps-2 flex-grow-1">
    <small class="text-muted d-block lh-1 mb-1">תוצאת סריקה:</small>
    <strong class="text-primary fs-5 d-block">{{ qrResultString }}</strong>
  </div>

  <div class="d-flex align-items-center gap-2">

    <button class="btn btn-primary d-flex align-items-center justify-content-center px-3 py-2"
      (click)="onConfirmSelection()">
      <mat-icon class="fs-5 w-auto h-auto me-1">check</mat-icon>
      <span class="fw-bold">בחר</span>
    </button>

    <button class="btn btn-outline-danger d-flex align-items-center justify-content-center p-2" (click)="clearResult()"
      aria-label="ביטול">
      <mat-icon class="fs-5 w-auto h-auto">close</mat-icon>
    </button>

  </div>

</section>
}

@if (noCameraMode()) {
  <div class="alert alert-warning m-3 text-center shadow-sm">
    <mat-icon class="d-block mx-auto mb-2">no_photography</mat-icon>
    <strong>לא נמצאה מצלמה זמינה</strong>
    <p class="small mb-3">לא ניתן לסרוק ברקוד במכשיר זה.</p>

    <button class="btn btn-primary w-100 py-3" (click)="openManualSelection()">
      מעבר לבחירה ידנית מרשימה
    </button>
  </div>
}
