<div class="scanner-wrapper d-flex flex-column align-items-center justify-content-center">
  <div class="scanner-viewport">
    <zxing-scanner
      [torch]="torchEnabled"
      [device]="deviceCurrent"
      (deviceChange)="onDeviceChange($event)"
      (scanSuccess)="onCodeResult($event)"
      [formats]="formatsEnabled"
      [tryHarder]="tryHarder"
      (permissionResponse)="onHasPermission(true)"
      (camerasFound)="onCamerasFound($event)"
      (torchCompatible)="onTorchCompatible($event)">
    </zxing-scanner>

    <div class="scanner-overlay">
      <div class="focus-frame"></div>
      <div class="scan-line"></div> </div>
  </div>
</div>

@if (qrResultString) {
  <section class="results-card shadow-sm mt-3 mx-3 d-flex justify-content-between align-items-center">
    <div class="ps-3">
      <small class="text-muted d-block">תוצאת סריקה:</small>
      <strong class="text-primary">{{ qrResultString }}</strong>
    </div>
    <button class="btn btn-link text-danger" (click)="clearResult()">
      <mat-icon>close</mat-icon>
    </button>
  </section>
}
