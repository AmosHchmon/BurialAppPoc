<div class="active-transport-content py-3" dir="rtl">

  <div class="bg-primary text-white p-3 shadow-sm rounded-4 mb-3 mx-2">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="fw-bold">סטטוס העמסה</span>
      <span class="badge bg-white text-primary">{{ transportService.activeBags().length }}/3</span>
    </div>
    <div class="progress" style="height: 10px; background: rgba(255,255,255,0.2)">
      <div class="progress-bar bg-white"
           [style.width.%]="(transportService.activeBags().length / 3) * 100">
      </div>
    </div>
  </div>

  <div class="container-fluid">
    @for (bag of transportService.activeBags(); track $index) {
      <div class="card mb-2 border-0 shadow-sm rounded-3 overflow-hidden position-relative">
        <div class="card-body p-3 d-flex align-items-center">

          <button class="btn btn-link text-danger p-0 ms-3" (click)="transportService.removeBag($index)">
            <mat-icon>delete_sweep</mat-icon>
          </button>

          <div class="flex-grow-1 text-end">
            <div class="fw-bold fs-5 mb-0">{{ bag.fullName }}</div>
            <div class="text-muted small">
              ת"ז: {{ bag.identityNumber }} | שק: <br>
              <span class="text-primary fw-bold font-monospace">{{ bag.bagNumber }}</span>
            </div>
          </div>

          <div class="text-primary opacity-50 fw-bold fs-4 me-2">
            #{{ $index + 1 }}
          </div>
        </div>
      </div>
    }
  </div>
</div>
